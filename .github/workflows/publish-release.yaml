name: Publish Release

on:
  push:
    tags:
      - 'v*'
      - 'chart-v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag to publish or recover.
        required: true
        type: string
      dry_run:
        description: Validate and package without publishing artifacts or a GitHub Release.
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CHART_REPOSITORY: ghcr.io/${{ github.repository_owner }}/charts
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag_name }}
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}

concurrency:
  group: publish-release-${{ github.event_name == 'push' && github.ref_name || inputs.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.ref || format('refs/tags/{0}', inputs.tag_name) }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Validate release metadata
        id: metadata
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail

          semver_re='^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'
          chart_yaml='charts/openbao-entity-operator/Chart.yaml'
          chart_version="$(awk '$1 == "version:" { value=$2; gsub(/^"/, "", value); gsub(/"$/, "", value); print value; exit }' "$chart_yaml")"
          app_version="$(awk '$1 == "appVersion:" { value=$2; gsub(/^"/, "", value); gsub(/"$/, "", value); print value; exit }' "$chart_yaml")"

          if [[ ! "$chart_version" =~ $semver_re ]]; then
            echo "Chart.yaml version must use X.Y.Z or X.Y.Z-rc.N, got: $chart_version" >&2
            exit 1
          fi
          if [[ ! "$app_version" =~ $semver_re ]]; then
            echo "Chart.yaml appVersion must use X.Y.Z or X.Y.Z-rc.N, got: $app_version" >&2
            exit 1
          fi

          case "$RELEASE_TAG" in
            v*)
              operator_version="${RELEASE_TAG#v}"
              if [[ "$chart_version" != "$operator_version" || "$app_version" != "$operator_version" ]]; then
                echo "Paired release tag $RELEASE_TAG requires matching Chart.yaml version and appVersion" >&2
                exit 1
              fi
              release_kind=operator
              make_latest=true
              ;;
            chart-v*)
              chart_tag_version="${RELEASE_TAG#chart-v}"
              if [[ "$chart_version" != "$chart_tag_version" ]]; then
                echo "Chart.yaml version $chart_version does not match chart tag $RELEASE_TAG" >&2
                exit 1
              fi
              operator_version="$app_version"
              release_kind=chart
              make_latest=false
              ;;
            *)
              echo "Release tag must start with v or chart-v: $RELEASE_TAG" >&2
              exit 1
              ;;
          esac

          prerelease=false
          if [[ "$RELEASE_TAG" == *-rc.* ]]; then
            prerelease=true
            make_latest=false
          fi

          {
            echo "release_kind=$release_kind"
            echo "chart_version=$chart_version"
            echo "operator_version=$operator_version"
            echo "prerelease=$prerelease"
            echo "make_latest=$make_latest"
          } >> "$GITHUB_OUTPUT"

      - name: Check generated and rendered artifacts
        run: make verify-generated helm-template

      - name: Log in to GitHub Container Registry
        if: env.DRY_RUN != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Helm registry
        if: env.DRY_RUN != 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "${{ env.REGISTRY }}" -u "${{ github.actor }}" --password-stdin

      - name: Build and push operator image
        if: steps.metadata.outputs.release_kind == 'operator'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: ${{ env.DRY_RUN != 'true' }}
          load: ${{ env.DRY_RUN == 'true' }}
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.metadata.outputs.operator_version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.RELEASE_TAG }}

      - name: Verify image for chart-only release
        if: steps.metadata.outputs.release_kind == 'chart' && env.DRY_RUN != 'true'
        env:
          OPERATOR_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          OPERATOR_VERSION: ${{ steps.metadata.outputs.operator_version }}
        run: docker manifest inspect "${OPERATOR_IMAGE}:${OPERATOR_VERSION}" >/dev/null

      - name: Check whether chart package already exists
        id: chart_exists
        if: env.DRY_RUN != 'true'
        env:
          CHART_REPOSITORY: ${{ env.CHART_REPOSITORY }}
          CHART_VERSION: ${{ steps.metadata.outputs.chart_version }}
          OPERATOR_VERSION: ${{ steps.metadata.outputs.operator_version }}
        run: |
          set -euo pipefail

          existing_chart="$(helm show chart "oci://${CHART_REPOSITORY}/openbao-entity-operator" --version "$CHART_VERSION" 2>/dev/null || true)"
          if [ -n "$existing_chart" ]; then
            existing_app_version="$(awk '$1 == "appVersion:" { value=$2; gsub(/^"/, "", value); gsub(/"$/, "", value); print value; exit }' <<<"$existing_chart")"
            if [ "$existing_app_version" != "$OPERATOR_VERSION" ]; then
              echo "Existing chart $CHART_VERSION has appVersion $existing_app_version, expected $OPERATOR_VERSION" >&2
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package chart
        run: make helm-package CHART_PACKAGE_DIR=dist

      - name: Push chart
        if: env.DRY_RUN != 'true' && steps.chart_exists.outputs.exists != 'true'
        env:
          CHART_REPOSITORY: ${{ env.CHART_REPOSITORY }}
          CHART_VERSION: ${{ steps.metadata.outputs.chart_version }}
        run: helm push "dist/openbao-entity-operator-${CHART_VERSION}.tgz" "oci://${CHART_REPOSITORY}"

      - name: Report dry-run result
        if: env.DRY_RUN == 'true'
        run: echo "Dry run passed for ${RELEASE_TAG}; no image, chart, or GitHub Release was published."

      - name: Create GitHub Release
        if: env.DRY_RUN != 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          make_latest: ${{ steps.metadata.outputs.make_latest }}
          prerelease: ${{ steps.metadata.outputs.prerelease }}
          files: dist/openbao-entity-operator-${{ steps.metadata.outputs.chart_version }}.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
