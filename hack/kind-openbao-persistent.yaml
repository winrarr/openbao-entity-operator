apiVersion: v1
kind: Namespace
metadata:
  name: ${PERSISTENT_OPENBAO_NAMESPACE}
  labels:
    app.kubernetes.io/name: openbao-persistent
    app.kubernetes.io/managed-by: openbao-entity-operator
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-persistent-config
  namespace: ${PERSISTENT_OPENBAO_NAMESPACE}
  labels:
    app.kubernetes.io/name: openbao-persistent
    app.kubernetes.io/managed-by: openbao-entity-operator
data:
  config.hcl: |
    ui = false
    disable_mlock = true
    api_addr = "https://${PERSISTENT_OPENBAO_SERVICE}.${PERSISTENT_OPENBAO_NAMESPACE}.svc.cluster.local:8200"
    cluster_addr = "https://${PERSISTENT_OPENBAO_SERVICE}.${PERSISTENT_OPENBAO_NAMESPACE}.svc.cluster.local:8201"

    listener "tcp" {
      address         = "0.0.0.0:8200"
      cluster_address = "0.0.0.0:8201"
      tls_cert_file   = "/openbao/tls/tls.crt"
      tls_key_file    = "/openbao/tls/tls.key"
      tls_min_version = "tls12"
    }

    storage "raft" {
      path    = "/openbao/data"
      node_id = "openbao-persistent"
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openbao-persistent-data
  namespace: ${PERSISTENT_OPENBAO_NAMESPACE}
  labels:
    app.kubernetes.io/name: openbao-persistent
    app.kubernetes.io/managed-by: openbao-entity-operator
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${PERSISTENT_OPENBAO_DEPLOYMENT}
  namespace: ${PERSISTENT_OPENBAO_NAMESPACE}
  labels:
    app.kubernetes.io/name: openbao-persistent
    app.kubernetes.io/managed-by: openbao-entity-operator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: openbao-persistent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openbao-persistent
    spec:
      containers:
        - name: openbao
          image: ${OPENBAO_IMAGE}
          imagePullPolicy: IfNotPresent
          command:
            - bao
          args:
            - server
            - -config=/openbao/config/config.hcl
          ports:
            - name: api
              containerPort: 8200
              protocol: TCP
            - name: cluster
              containerPort: 8201
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true&uninitcode=200&sealedcode=200
              port: api
              scheme: HTTPS
            initialDelaySeconds: 2
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true&uninitcode=200&sealedcode=200
              port: api
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /openbao/config
              readOnly: true
            - name: tls
              mountPath: /openbao/tls
              readOnly: true
            - name: data
              mountPath: /openbao/data
      volumes:
        - name: config
          configMap:
            name: openbao-persistent-config
        - name: tls
          secret:
            secretName: ${PERSISTENT_OPENBAO_TLS_SECRET}
        - name: data
          persistentVolumeClaim:
            claimName: openbao-persistent-data
---
apiVersion: v1
kind: Service
metadata:
  name: ${PERSISTENT_OPENBAO_SERVICE}
  namespace: ${PERSISTENT_OPENBAO_NAMESPACE}
  labels:
    app.kubernetes.io/name: openbao-persistent
    app.kubernetes.io/managed-by: openbao-entity-operator
spec:
  selector:
    app.kubernetes.io/name: openbao-persistent
  ports:
    - name: api
      port: 8200
      targetPort: api
      protocol: TCP
    - name: cluster
      port: 8201
      targetPort: cluster
      protocol: TCP
