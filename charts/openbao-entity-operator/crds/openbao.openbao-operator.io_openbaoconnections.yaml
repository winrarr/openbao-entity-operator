---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: openbaoconnections.openbao.openbao-operator.io
spec:
  group: openbao.openbao-operator.io
  names:
    categories:
    - openbao
    kind: OpenBaoConnection
    listKind: OpenBaoConnectionList
    plural: openbaoconnections
    singular: openbaoconnection
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.address
      name: Address
      type: string
    - jsonPath: .status.authenticated
      name: Authenticated
      type: boolean
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: OpenBaoConnection is the Schema for the openbaoconnections API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of OpenBaoConnection
            properties:
              address:
                description: Address is the OpenBao API address without the /v1 API
                  prefix.
                minLength: 1
                pattern: ^https?://
                type: string
              caBundleSecretRef:
                description: |-
                  CABundleSecretRef optionally references a same-namespace Secret containing a PEM CA bundle.
                  The key defaults to ca.crt when omitted.
                properties:
                  key:
                    description: Key is the Secret data key. It defaults to token
                      for token references.
                    type: string
                  name:
                    description: Name is the Secret resource name.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              namespace:
                description: |-
                  Namespace is an optional absolute or relative OpenBao namespace path.
                  An empty value targets the root namespace. The value is sent as the
                  X-Vault-Namespace request header.
                pattern: ^$|^[^/[:space:]]+([/][^/[:space:]]+)*$
                type: string
                x-kubernetes-validations:
                - message: namespace is immutable; delete and recreate the OpenBaoConnection
                  rule: self == oldSelf
              requestTimeout:
                default: 30s
                description: RequestTimeout bounds each request made to OpenBao.
                type: string
              tokenSecretRef:
                description: TokenSecretRef references a same-namespace Secret containing
                  an OpenBao token.
                properties:
                  key:
                    description: Key is the Secret data key. It defaults to token
                      for token references.
                    type: string
                  name:
                    description: Name is the Secret resource name.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            required:
            - address
            - tokenSecretRef
            type: object
          status:
            description: status defines the observed state of OpenBaoConnection
            properties:
              authenticated:
                description: Authenticated reports whether the configured token was
                  accepted.
                type: boolean
              conditions:
                description: Conditions represent the latest available observations
                  of the connection.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              initialized:
                description: |-
                  Initialized reports whether OpenBao has been initialized according to the last root-namespace health check.
                  It is not populated for namespace-scoped connections.
                type: boolean
              observedGeneration:
                description: ObservedGeneration is the most recent generation reflected
                  in status.
                format: int64
                type: integer
              sealed:
                description: |-
                  Sealed reports whether OpenBao was sealed during the last root-namespace health check.
                  It is not populated for namespace-scoped connections.
                type: boolean
              standby:
                description: |-
                  Standby reports whether this server is a standby node according to the last root-namespace health check.
                  It is not populated for namespace-scoped connections.
                type: boolean
              version:
                description: |-
                  Version is the OpenBao server version observed during the last root-namespace health check.
                  It is empty for namespace-scoped connections because OpenBao does not expose sys/health in a namespace.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
