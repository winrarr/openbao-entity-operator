{{- $imageTag := default .Chart.AppVersion .Values.image.tag -}}
{{- $image := printf "%s:%s" .Values.image.repository $imageTag -}}
{{- if .Values.image.digest -}}
{{- $image = printf "%s@%s" .Values.image.repository .Values.image.digest -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openbao-entity-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "openbao-entity-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "openbao-entity-operator.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
{{ include "openbao-entity-operator.labels" . | nindent 8 }}
        app.kubernetes.io/component: controller
        control-plane: controller-manager
{{- with .Values.podLabels }}
{{ toYaml . | nindent 8 }}
{{- end }}
      annotations:
        kubectl.kubernetes.io/default-container: manager
{{- with .Values.podAnnotations }}
{{ toYaml . | nindent 8 }}
{{- end }}
    spec:
      serviceAccountName: {{ include "openbao-entity-operator.serviceAccountName" . }}
      securityContext:
{{ toYaml .Values.podSecurityContext | nindent 8 }}
{{- with .Values.image.pullSecrets }}
      imagePullSecrets:
{{ toYaml . | nindent 8 }}
{{- end }}
{{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
{{- end }}
      containers:
        - name: manager
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /manager
          args:
            - --health-probe-bind-address={{ .Values.healthProbeBindAddress }}
            - --enable-http2={{ .Values.enableHTTP2 }}
{{- if .Values.leaderElection }}
            - --leader-elect=true
{{- end }}
{{- if .Values.metrics.enabled }}
            - --metrics-bind-address=:{{ .Values.metrics.port }}
            - --metrics-secure={{ .Values.metrics.secure }}
{{- if and .Values.metrics.secure .Values.metrics.tls.certificateSecret }}
            - --metrics-cert-path=/tmp/k8s-metrics-server/serving-certs
{{- end }}
{{- else }}
            - --metrics-bind-address=0
{{- end }}
{{- with .Values.env }}
          env:
{{ toYaml . | nindent 12 }}
{{- end }}
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
{{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
{{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
{{ toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
{{ toYaml .Values.resources | nindent 12 }}
{{- if and .Values.metrics.enabled .Values.metrics.secure .Values.metrics.tls.certificateSecret }}
          volumeMounts:
            - name: metrics-certificate
              mountPath: /tmp/k8s-metrics-server/serving-certs
              readOnly: true
{{- end }}
{{- if and .Values.metrics.enabled .Values.metrics.secure .Values.metrics.tls.certificateSecret }}
      volumes:
        - name: metrics-certificate
          secret:
            secretName: {{ .Values.metrics.tls.certificateSecret }}
{{- end }}
{{- with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.tolerations }}
      tolerations:
{{ toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.affinity }}
      affinity:
{{ toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
{{ toYaml . | nindent 8 }}
{{- end }}
      terminationGracePeriodSeconds: 10
