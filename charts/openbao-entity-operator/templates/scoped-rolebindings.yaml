{{- if gt (len .Values.watchNamespaces) 0 }}
{{- range $namespace := .Values.watchNamespaces }}
{{- if gt (len $namespace) 63 }}
{{- fail (printf "watchNamespaces entry %q is longer than 63 characters" $namespace) }}
{{- end }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $namespace) }}
{{- fail (printf "watchNamespaces entry %q is not a DNS label" $namespace) }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "openbao-entity-operator.fullname" $ }}-manager
  namespace: {{ $namespace }}
  labels:
{{ include "openbao-entity-operator.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "openbao-entity-operator.fullname" $ }}-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "openbao-entity-operator.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
