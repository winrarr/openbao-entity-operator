[project]
site_name = "OpenBao Entity Operator"
site_description = "Kubernetes-native lifecycle management for OpenBao identity entities."
site_author = "winrarr"
copyright = "Copyright © 2026 winrarr"
site_url = "https://winrarr.github.io/openbao-entity-operator/"
docs_dir = "docs"
site_dir = "site"
repo_url = "https://github.com/winrarr/openbao-entity-operator"
repo_name = "winrarr/openbao-entity-operator"
edit_uri = "edit/main/docs/"
strict = true
nav = [
  { "Introduction" = [
    { "Overview" = "index.md" },
    { "Quickstart" = "quickstart.md" },
    { "Installation" = "introduction/installation.md" },
    { "Concepts" = "introduction/concepts.md" },
    { "FAQ" = "introduction/faq.md" },
  ] },
  { "Guides" = [
    { "Connection Patterns" = "reference/connection-patterns.md" },
    { "Multi-tenancy" = "reference/multi-tenancy.md" },
    { "Deletion and Ownership" = "reference/deletion-and-ownership.md" },
    { "Troubleshooting" = "reference/troubleshooting.md" },
    { "Examples" = [
      { "Overview" = "examples/index.md" },
      { "Connection and Identity" = "examples/connection-and-identity.md" },
      { "Durable Configuration" = "examples/durable-configuration.md" },
    ] },
  ] },
  { "Resource Guides" = [
    { "Overview" = "crds/index.md" },
    { "OpenBaoConnection" = "crds/openbao-connection.md" },
    { "OpenBaoPolicy" = "crds/openbao-policy.md" },
    { "OpenBaoKubernetesAuthRole" = "crds/openbao-kubernetes-auth-role.md" },
    { "OpenBaoEntity" = "crds/openbao-entity.md" },
    { "OpenBaoEntityAlias" = "crds/openbao-entity-alias.md" },
    { "OpenBaoGroup" = "crds/openbao-group.md" },
    { "OpenBaoGroupMembership" = "crds/openbao-group-membership.md" },
    { "Identity and MFA Configuration" = "crds/openbao-identity-configuration.md" },
    { "OIDC Configuration" = "crds/openbao-oidc.md" },
    { "OpenBao Configuration" = "crds/openbao-configuration.md" },
  ] },
  { "Product" = [
    { "Product Scope" = "product.md" },
    { "User Stories" = "user-stories.md" },
    { "Compatibility" = "compatibility.md" },
    { "Backlog" = "backlog.md" },
    { "Tech Debt" = "tech-debt.md" },
  ] },
  { "Architecture" = [
    { "Architecture" = "architecture.md" },
    { "Decisions" = "decisions/index.md" },
  ] },
  { "Operations" = [
    { "Operations" = "operations/index.md" },
    { "Local Kind" = "operations/local-kind.md" },
    { "Kubernetes Auth" = "operations/kubernetes-auth.md" },
    { "AppRole" = "operations/approle.md" },
  ] },
  { "Reference" = [
    { "Reference" = "reference/index.md" },
    { "Resource Index" = "reference/resources.md" },
    { "Status and Conditions" = "reference/status-and-conditions.md" },
    { "Deletion and Ownership" = "reference/deletion-and-ownership.md" },
    { "Operator Configuration" = "reference/operator-configuration.md" },
    { "Generated API Reference" = "reference/api.md" },
    { "OpenBao API Research" = "research/2026-09-16-openbao-api.md" },
    { "Multi-tenancy Research" = "research/2026-09-16-multi-tenancy.md" },
    { "Verification" = "verification.md" },
  ] },
  { "Contributing" = [
    { "Contributing" = "contributing/index.md" },
    { "Local Development" = "contributing/local-development.md" },
    { "Testing" = "contributing/testing.md" },
    { "Documentation" = "contributing/documentation.md" },
  ] },
]

[project.theme]
features = [
  "navigation.instant",
  "navigation.tabs",
  "navigation.sections",
  "navigation.tracking",
  "navigation.top",
  "navigation.indexes",
  "search.highlight",
  "search.suggest",
  "content.code.copy",
  "content.action.edit",
  "content.action.view",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.extra]
generator = false

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/winrarr/openbao-entity-operator"

[project.validation]
invalid_links = true
invalid_link_anchors = true
